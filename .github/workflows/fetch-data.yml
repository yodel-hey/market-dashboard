name: Fetch Market Data

on:
  schedule:
        # Beide Zeitsätze (Sommer = CDT/UTC-5, Winter = CST/UTC-6) sind aktiv.
    # Das Python-Skript prüft die Chicago-Zeit (ACTIVE_TIMES) und beendet sich
    # sofort, wenn der Lauf nicht zu einer Zielzeit passt. Nie mehr umstellen.
    # Sommerzeit
    - cron: '8 5 * * *'    # 00:08 CDT
    - cron: '9 7 * * *'    # 02:09 CDT
    - cron: '8 10 * * *'   # 05:08 CDT
    - cron: '9 13 * * *'   # 08:09 CDT
    - cron: '10 14 * * *'  # 09:10 CDT
    - cron: '9 17 * * *'   # 12:09 CDT
    - cron: '11 20 * * *'  # 15:11 CDT
    # Winterzeit
    - cron: '8 6 * * *'    # 00:08 CST
    - cron: '9 8 * * *'    # 02:09 CST
    - cron: '8 11 * * *'   # 05:08 CST
    - cron: '9 14 * * *'   # 08:09 CST
    - cron: '10 15 * * *'  # 09:10 CST
    - cron: '9 18 * * *'   # 12:09 CST
    - cron: '11 21 * * *'  # 15:11 CST
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run now regardless of active hours (testing only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # needed so this workflow can commit data.json / history.json back into the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data fetch script
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          BIGDATA_API_KEY: ${{ secrets.BIGDATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Only set (to a truthy value) when someone ticks the "force_run"
          # checkbox on a manual workflow_dispatch run. On the regular
          # schedule triggers this input doesn't exist, so this evaluates to
          # an empty string and the script's normal active-times check applies.
          FORCE_RUN: ${{ inputs.force_run }}
        run: python scripts/fetch_market_data.py

      - name: Commit updated data.json
        run: |
          # Defensive: if a run lands outside all active-time tolerance
          # windows, data.json won't exist yet - don't fail in that case.
          if [ ! -f data.json ]; then
            echo "No data.json produced this run (outside all active-time windows) - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          if git diff --staged --quiet; then
            echo "No changes to data.json - nothing to commit."
          else
            git commit -m "Update market data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
